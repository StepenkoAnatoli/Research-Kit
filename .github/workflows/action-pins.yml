name: action-pins

# Does every action these workflows pin by commit SHA still resolve?
#
# Every third-party action is pinned to a full SHA (collector-workflow.test.mjs enforces it).
# A pin whose commit disappears upstream fails every workflow at checkout, before a single test
# runs, on whichever pull request is open (break-test PR #140). A weekly schedule finds that
# instead of a contributor. Read-only: it asks the GitHub API about four commits, nothing more.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # And whenever a pin can change: a pull request that edits a workflow or this check.
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/check-action-pins.mjs'

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, resolved 2026-09-26
        with:
          persist-credentials: false
      - name: every pinned action resolves
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-action-pins.mjs
