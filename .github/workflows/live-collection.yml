name: live-collection

# THE ONLY WORKFLOW THAT SPENDS MONEY, AND THE ONLY ONE THAT TOUCHES A VENDOR.
#
# `offline-suite` deliberately cannot reach the network, which is right: a reviewer or a
# fork must be able to re-run every check without being given a key. But that means the
# real network boundary is represented entirely by stubs, and the suite stays green while
# real collection fails on a changed payload, a proxy, a platform TLS quirk, or a 429.
#
# ONE SUCCESS PREDICATE, AND IT IS NOT "the steps ran".
#
# The first version of this workflow ran the right checks and then swallowed every one of
# them with `|| true`, so a green run proved only that the repository was not modified.
# That is worse than no workflow: it is a signal that looks like verification. Every
# required condition below now fails the job, and the summary states which ones were
# checked - so a green run means all of this held:
#
#   1. the vendor CLI is a major this adapter supports
#   2. the collection command exited 0
#   3. a ledger was written, and it parses
#   4. handoff exits 0                  - the corpus arrived whole
#   5. the INTEGRITY checks pass        - provenance, corpus-shape, citations,
#                                         transport-provenance, hygiene
#   6. the repository is unchanged
#
# NOT the whole preflight verdict, and this was found by running the predicate for real
# rather than by reading it. `preflight` answers "is the RESEARCH sufficient to build",
# which is a human-authored question: a scratch project has no unknowns in its contract,
# so it fails `discovery-contract/no-unknowns` and exits 1 no matter how perfectly
# collection worked. Requiring it would have made this workflow fail on every run, always,
# for a reason having nothing to do with the transport it exists to test.
#
# The checks above are the ones collection can actually answer: the chain verifies, every
# cited capture was fetched and is on disk, the corpus parses, rows carry URLs and claims.
#
# Diagnostics are still captured when a step fails, but they are captured in a way that
# preserves the exit status rather than discarding it.
#
# WHEN TO RUN IT
#   - before trusting a Firecrawl CLI version this adapter has not seen
#   - after changing lib/firecrawl.mjs, lib/http-transport.mjs, lib/serpapi.mjs, lib/collect.mjs
#   - when a real collection fails in a way the offline suite cannot reproduce

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Pages to collect (each costs at least one credit)'
        required: true
        default: '2'
      transport:
        description: 'Which fetch route to exercise'
        required: true
        default: 'firecrawl-cli'
        type: choice
        options: [firecrawl-cli, http-keyless]
      cli_version:
        description: 'Firecrawl CLI version to install. "tested" pins the version the adapter was written against; "latest" is compatibility surveillance and may legitimately fail.'
        required: true
        default: 'tested'
        type: choice
        options: [tested, latest]

# Paid runs are SERIALISED.
#
# max_pages bounds one run. It does not bound the meter: two dispatches a second apart
# spend concurrently, and a reader who sees "max 10 pages" reasonably believes that is the
# ceiling. `cancel-in-progress: false` is deliberate - cancelling a paid collection
# mid-flight wastes the credits already spent and can leave a scratch ledger torn.
concurrency:
  group: live-collection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-collection
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-21

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, resolved 2026-09-21
        with:
          node-version: '22'

      - name: announce the run, its budget and its policy
        run: |
          {
            echo "| setting | value |"
            echo "|---|---|"
            echo "| run | ${{ github.run_id }} |"
            echo "| transport | ${{ inputs.transport }} |"
            echo "| max pages | ${{ inputs.max_pages }} |"
            echo "| CLI policy | ${{ inputs.cli_version }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: refuse an unbounded run
        run: |
          pages='${{ inputs.max_pages }}'
          case "$pages" in (''|*[!0-9]*) echo "max_pages must be a whole number"; exit 1;; esac
          if [ "$pages" -lt 1 ] || [ "$pages" -gt 10 ]; then
            echo "max_pages=$pages is outside 1..10."
            echo "This workflow spends real credits; a larger run belongs on a machine where"
            echo "somebody is watching the meter, not in CI."
            exit 1
          fi

      # Installation failure and INCOMPATIBILITY are different facts and are reported
      # separately. The first version suppressed both with `|| true`, so "the package
      # moved" and "the CLI is a major we do not support" looked identical.
      - name: install the vendor CLI
        id: cli
        if: inputs.transport == 'firecrawl-cli'
        run: |
          set -e
          tested=$(node -e 'import("./research-kit/lib/firecrawl.mjs").then(m => process.stdout.write(m.TESTED_CLI_VERSION))')
          if [ '${{ inputs.cli_version }}' = 'tested' ]; then
            spec="firecrawl@$tested"
            echo "pinning to the version this adapter was written against: $spec"
          else
            spec="firecrawl@latest"
            echo "SURVEILLANCE MODE: installing $spec. A refusal here is the workflow doing its job."
          fi
          if ! npm install -g "$spec"; then
            echo "::error::could not install $spec - this is an INSTALLATION failure, not an incompatibility"
            echo "| CLI install | \`failed: $spec\` |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          installed=$(firecrawl --version)
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
          echo "| CLI installed | \`$installed\` (tested against \`$tested\`) |" >> "$GITHUB_STEP_SUMMARY"

      - name: the CLI is a major this adapter supports
        if: inputs.transport == 'firecrawl-cli'
        run: |
          node -e '
            import("./research-kit/lib/firecrawl.mjs").then((m) => {
              const c = m.cliCompatibility();
              console.log(`${c.level}: ${c.detail}`);
              if (!c.supported) { console.error(`::error::${c.remedy}`); process.exit(1); }
            });
          '

      - name: the key is present, and is never printed
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "${FIRECRAWL_API_KEY:-}" ] && [ '${{ inputs.transport }}' = 'firecrawl-cli' ]; then
            echo "::error::FIRECRAWL_API_KEY is not set for the live-collection environment."
            echo "Add it under Settings > Environments > live-collection, or run with transport=http-keyless."
            exit 1
          fi
          echo "credential present: ${FIRECRAWL_API_KEY:+yes}${FIRECRAWL_API_KEY:-no (keyless route)}"

      # From here every step is REQUIRED. `set -e` is on and nothing is swallowed.
      - name: collect into a scratch project, never the repository's corpus
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          RESEARCH_KIT_TRANSPORT: ${{ inputs.transport }}
        run: |
          set -e
          kit="$PWD/research-kit"
          scratch="$RUNNER_TEMP/live-project"
          mkdir -p "$scratch"
          cd "$scratch"

          # A scratch project, so nothing this run collects can reach the repository's
          # hash-chained ledger. That ledger proves the corpus answers ITS OWN questions;
          # a CI capture in it would be evidence of nothing.
          node "$kit/bin/new-project.mjs" . --topic "live transport check"

          # doctor is diagnostic and may legitimately report a missing key on the keyless
          # route, so its status is recorded rather than required - the only step of which
          # that is true, and it is said here rather than hidden behind `|| true`.
          node "$kit/bin/doctor.mjs" || echo "doctor reported findings (not required to pass)"

          node "$kit/bin/research.mjs" --dry-run --depth quick
          node "$kit/bin/research.mjs" --depth quick --max-scrapes '${{ inputs.max_pages }}'

      - name: a ledger was written, and it parses
        run: |
          set -e
          cd "$RUNNER_TEMP/live-project"
          ledger='research/raw/.fetches.jsonl'
          if [ ! -s "$ledger" ]; then
            echo "::error::collection produced no fetch ledger; nothing was recorded"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const rows = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").filter(Boolean);
            const parsed = rows.map((line, i) => { try { return JSON.parse(line); } catch { throw new Error(`ledger line ${i + 1} does not parse`); } });
            const fetched = parsed.filter((r) => r.op !== "fail");
            if (!fetched.length) throw new Error("the ledger records no successful fetch");
            console.log(`${parsed.length} ledger entries, ${fetched.length} successful`);
          ' "$ledger"

      - name: the corpus arrived whole, and passes its integrity checks
        run: |
          set -e
          cd "$RUNNER_TEMP/live-project"
          kit="$GITHUB_WORKSPACE/research-kit"

          # REQUIRED, both of them. The point of collecting at all is that a real capture
          # must pass the same checks a synthetic one does - chain verifies, every cited
          # capture on disk, bodies unmodified. Diagnostics are printed on failure
          # WITHOUT discarding the exit status.
          if ! node "$kit/bin/handoff.mjs"; then
            echo "::error::handoff failed: the collected corpus did not arrive whole"
            exit 1
          fi
          # The INTEGRITY checks, one at a time, each required.
          #
          # Not the whole verdict: preflight also judges whether the research is
          # sufficient to build, and a scratch project has no unknowns in its contract -
          # so it fails and exits 1 however well collection worked. Verified by running
          # it: `discovery-contract/no-unknowns` blocks a freshly scaffolded project.
          for check in provenance corpus-shape citations transport-provenance hygiene; do
            if ! node "$kit/bin/preflight.mjs" --check "$check"; then
              echo "::error::integrity check '$check' failed on the collected corpus"
              exit 1
            fi
          done
          echo "all integrity checks passed on the collected corpus"

      - name: the repository is unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a live collection modified the repository"
            git status --porcelain
            exit 1
          fi
          echo "repository untouched"

      - name: sanitized diagnostics
        if: always()
        run: |
          cd "$RUNNER_TEMP/live-project" 2>/dev/null || exit 0
          # HOSTNAMES ONLY, deliberately.
          #
          # This summary is public. A URL is not a credential, but a path and a query
          # string disclose what was being researched - search terms, private targets,
          # account-scoped routes, signed parameters. The first version printed the first
          # 60 characters of each URL, which is exactly enough to leak the subject and not
          # enough to be useful. The shape of what happened needs no path.
          node -e '
            const fs = require("fs");
            const led = "research/raw/.fetches.jsonl";
            if (!fs.existsSync(led)) { console.log("no ledger written"); process.exit(0); }
            const rows = fs.readFileSync(led, "utf8").trim().split("\n").filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
            console.log("| op | status | transport | completeness | host |");
            console.log("|---|---|---|---|---|");
            for (const r of rows) {
              let host = "-";
              try { host = r.url ? new URL(r.url).hostname : "-"; } catch { host = "unparseable"; }
              console.log(`| ${r.op ?? "-"} | ${r.statusCode ?? "-"} | ${r.transport ?? "-"} | ${r.completeness ?? "-"} | ${host} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
